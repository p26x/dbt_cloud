version: 2
 
models:
  - name: staging_booking
    config:
      materialized: view
      schema: staging
      docs:
        node_color: "#000000"  # it will generate the docs on the color we specified
      access: public
      


    semantic_model:
      enabled: true
      name: staging_booking_semantic_model  # we can rename a semantic model
    agg_time_dimension: booking_date
    # if this is not defined as primary key in backend you have have it virtually in dbt
    # this only should use when there is no primary entity
    #primary_entity: booking_id 
    columns:
      - name: BOOKING_AMOUNT
        tests:
          - booking_amount_min:   # generic data-test 
              arguments:
                warn_if: "<=10000"
                error_if: ">=30000"
          - not_null:
              arguments:
                severity : warn
                #severity : warn #error
                
      - name : booking_id
        entity:
          name: bookingid_staging
          type: primary
          
      - name: booking_lisitng_id
        entity:
          name: listingid_staging    
          type: foreign

      - name: booking_date  
        granularity: day
        dimension:
          name: booking_date
          type: time
        config:
          meta:
            metricflow:
              primary_time: true
              #primary: true 


      - name: extract(year from booking_date)  
        dimension:
          name: booking_date_year
          type: categorical   

      - name: created_at
        granularity: day
        dimension:
          name: booking_created_at_staging
          type: time

      - name: created_at
        granularity: hour
        dimension:
          name: booking_created_at_staging_hour
          type: time
      
      - name: booking_year
        dimension:
          name: booking_year
          type: categorical


      - name: booking_month
        dimension:
          name: booking_month
          type: categorical

    derived_semantics:
      entities:
        #- name: booking_created_at 
        #  type: unique  # using this date we can join other tables
        #  expr: booking_created_at_staging 
  
        - name: booking_id_substr
          type: foreign  
          expr: "substring(bookingid_staging from 3)" 

        - name: booking_id_concat
          type: foreign 
          expr: "'pri-'||'|'|| bookingid_staging"

      dimensions:
        - name: booking_status_categorical
          type: categorical  
          expr: "case when booking_amount > 1000 then 'Valid' else 'No Valid' end"
          config:
            meta:
              usage: "marking where ever booking amount is greated then 1000 as valid else not valid"

    metrics:
      - name: sum_of_booking_amt_staging
        type: simple
        agg: sum
        expr: booking_amount
        config:
          enabled: true

      - name: sum_of_booking_amt_staging_hour
        type: simple
        agg: sum
        expr: booking_amount
        agg_time_dimension: booking_created_at_staging_hour #override to use created_ar as the time dimension
        config:
          enabled: true
          
      - name: avg_of_booking_amt_staging
        type: simple
        agg: average
        expr: booking_amount
        config:
          enabled: true
      
      - name: day_wise_cummilative_count
        type: cumulative
        input_metric: sum_of_booking_amt_staging
        grain_to_date: day
        config:
          enabled: true

# dbt sl query --metrics day_wise_cummilative_count --group-by metric_time__day
       
      - name: revenue_mtd_cumulative_staging
        type: cumulative
        input_metric: sum_of_booking_amt_staging
        grain_to_date: year
        config:
          enabled: true

# dbt sl query --metrics revenue_mtd_cumulative_staging --group-by metric_time__month

#Issue Encountered:-  Previously we get 0 because current month has 0 data, so caluclation didn't worked added coalesc to handel null values

      - name: yearly_growth_pct_staging
        type: derived
        expr: ((coalesce(current_year,0) - coalesce(prev_year,0) )/ nullif(prev_year,0)) * 100
        config:
          enabled: true
        input_metrics:
          - name : sum_of_booking_amt_staging
            alias: current_year

          - name : sum_of_booking_amt_staging
            alias: prev_year
            offset_window: 1 year  # lag

# dbt sl query --metrics monthly_growth_pct_staging --group-by metric_time__year


      - name: per_yearly_sum
        type: derived
        expr: coalesce(prev_year_lag, 0)
        config:
          enabled: true
        input_metrics:
          - name : sum_of_booking_amt_staging
            alias: prev_year_lag
            offset_window: 1 year  # lag
            #filter: "{{ Dimension('booking_date') }} >= '2023-01-01'"


saved_queries:

  # ── Simple metrics only (no offset) - safe for Tableau ──
  - name: yearly_simple_metrics
    query_params:
      metrics:
        - sum_of_booking_amt_staging
        - avg_of_booking_amt_staging
      group_by:
        #- TimeDimension('metric_time', 'year')
        - Dimension('bookingid_staging__booking_date_year')
    exports:
      - name: yearly_simple_table
        config:
          export_as: table
          schema: gold

  # ── Offset metrics - use via CLI or Snowflake table directly ──
  - name: yearly_pct_cal
    query_params:
      metrics: [sum_of_booking_amt_staging,per_yearly_sum,yearly_growth_pct_staging,avg_of_booking_amt_staging]
      group_by:
        - TimeDimension('bookingid_staging__booking_date','year')

        #- Dimension('bookingid_staging__booking_date_year')
      #where:
      #  - "{{ Metric('sum_of_booking_amt_staging', group_by=['bookingid_staging']) }} is not null"
    exports:
      - name: yearly_pct_growth_table 
        config:
          export_as: table
          schema: gold

