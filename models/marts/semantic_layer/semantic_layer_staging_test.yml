version: 2
 
models:
  - name: bronze_bookings
    config:
      materialized: table
      schema: bronze
      docs:
        node_color: "#000000"  # it will generate the docs on the color we specified
      access: public
      


    semantic_model:
      enabled: true
    agg_time_dimension: booking_date
   
    columns:
      - name: BOOKING_AMOUNT
        tests:
          - booking_amount_min:   # generic data-test 
              arguments:
                warn_if: "<=10000"
                error_if: ">=30000"
          - not_null:
              arguments:
                severity : warn
                #severity : warn #error
                
      - name : booking_id
        entity:
          name: bookingid_staging
          type: primary
          
      - name: booking_lisitng_id
        entity:
          name: listingid_staging    
          type: foreign

      - name: booking_date  
        granularity: day
        dimension:
          name: booking_date
          type: time
        config:
          meta:
            metricflow:
              primary_time: true
              #primary: true 
             
      - name: created_at
        granularity: day
        dimension:
          name: booking_created_at_staging
          type: time
      
      - name: Y
        dimension:
          name: booking_year
          type: categorical

      - name: M
        dimension:
          name: booking_month
          type: categorical
          
 
      - name: booking_status
        dimension:
          name: booking_status_staging
          type: categorical

    metrics:
      - name: sum_of_booking_amt_staging
        type: simple
        agg: sum
        expr: booking_amount
        config:
          enabled: true

      - name: avg_of_booking_amt_staging
        type: simple
        agg: average
        expr: booking_amount
        config:
          enabled: true
      
      - name: day_wise_cummilative_count
        type: cumulative
        input_metric: sum_of_booking_amt_staging
        grain_to_date: day
        config:
          enabled: true

# dbt sl query --metrics day_wise_cummilative_count --group-by metric_time__day
       
      - name: revenue_mtd_cumulative_staging
        type: cumulative
        input_metric: sum_of_booking_amt_staging
        grain_to_date: year
        config:
          enabled: true

# dbt sl query --metrics revenue_mtd_cumulative_staging --group-by metric_time__month

#Issue Encountered:-  Previously we get 0 because current month has 0 data, so caluclation didn't worked added coalesc to handel null values

      - name: yearly_growth_pct_staging
        type: derived
        expr: ((coalesce(current_year,0) - coalesce(prev_year,0) )/ nullif(prev_year,0)) * 100
        config:
          enabled: true
        input_metrics:
          - name : sum_of_booking_amt_staging
            alias: current_year

          - name : sum_of_booking_amt_staging
            alias: prev_year
            offset_window: 1 year  # lag

# dbt sl query --metrics monthly_growth_pct_staging --group-by metric_time__year


      - name: per_yearly_sum
        type: derived
        expr: prev_year_lag
        config:
          enabled: true
        input_metrics:
          - name : sum_of_booking_amt_staging
            alias: prev_year_lag
            offset_window: 1 year  # lag


saved_queries:

  # ── Simple metrics only (no offset) - safe for Tableau ──
  - name: yearly_simple_metrics
    query_params:
      metrics:
        - sum_of_booking_amt_staging
        - avg_of_booking_amt_staging
      group_by:
        - "TimeDimension('metric_time', 'year')"
        - "Dimension('bookingid_staging__booking_year')"
    exports:
      - name: yearly_simple_table
        config:
          export_as: table
          schema: gold

  # ── Offset metrics - use via CLI or Snowflake table directly ──
  - name: yearly_pct_cal
    query_params:
      metrics:
        - sum_of_booking_amt_staging
        - per_yearly_sum
        - yearly_growth_pct_staging
        - avg_of_booking_amt_staging
      group_by:
        - "TimeDimension('metric_time', 'year')"
        - "Dimension('bookingid_staging__booking_year')"
    exports:
      - name: yearly_pct_growth_table
        config:
          export_as: table
          schema: gold

